services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: cinerush
      POSTGRES_USER: cinerush
      POSTGRES_PASSWORD: password123
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgres-data: